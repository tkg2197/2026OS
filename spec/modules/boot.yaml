module: kernel/boot
owns:
- src/kernel/boot/entry.S
- src/kernel/boot/start.c
- src/kernel/main.c
state:
  CPU_stack: 每物理hart槽位4096字节，数组整体16字节对齐；qemu分配2槽，有效hart为0..1；vf2槽位数和有效hart由学生填写的NCPU、FIRST_HART决定，FIRST_HART以下的槽位不运行。
  boot_hartid: start.c定义的uint64全局变量；_entry清空BSS后记录首次进入内核的有效物理hart ID，次级入口保持其值。
  initialized: boot_hartid完成共享初始化后发布；其他hart在使用共享页表和trap状态前等待该标志。
  firmware_handoff: 首次交接以S-mode进入_entry，a0为hart ID，a1为匹配板卡的DTB地址；HSM以a0=hartid、a1=opaque进入_entry_secondary，本内核不解析a1。
  image_header: vf2镜像首64字节为RISC-V Image头，入口与生成的kernel.ld一致；qemu入口为0x80200000且不插入Image头。
rules:
- 共享模块和首进程只由boot_hartid初始化一次；所有有效hart都安装自己的页表和trap环境，不要求启动hart固定为0或1。
- M-mode CSR、PMP、异常委派和CLINT由OpenSBI管理；内核不得直接配置或访问这些机器态资源。
- 固件必须支持SBI TIME/HSM；首次交接只允许一个有效hart进入_entry，其余有效hart处于可由HSM启动的状态。HSM返回错误属于不可继续的启动失败，不忽略already-started或退化为少核。
- vf2复用现有OpenSBI/U-Boot，以booti交接，要求匹配板卡的DTB、手册或DTB中的timebase和正常工作的UART0；固件已配置好的串口参数由内核继承，不重配波特率。
- vf2的DRAM布局、内核管理窗口由学生查阅手册、DTB和bdinfo填写；OpenSBI、运行中的U-Boot、保留内存和DTB均不得与该窗口冲突。DTB应加载到窗口外，加载失败即停止，不启动旧内存内容。
- 本规格描述模板机制及学生应完成的启动契约；start中的w_tp/main和原有进程初始化、首用户进入等实验留空仍由学生完成。
functions:
  _entry:
    pre:
    - 固件按当前平台的链接入口以S-mode交接，a0为物理hart ID；只有首次启动hart进入本入口。
    effects:
    - vf2在_entry直接放置64字节Image头；偏移0x00的code0在.option norvc范围内用32位跳转到头后首次启动代码，偏移0x04的code1为32位nop。
    - 头中0x08处uint64 text_offset=0x200000，0x10处uint64 image_size=KERNEL_IMAGE_SIZE，0x18处uint64 flags=0，0x20处uint32 version=2，0x24处uint32 res1=0，0x28处uint64 res2=0，0x30处uint64 magic64=0x5643534952，0x38处uint32 magic2=0x05435352，0x3c处uint32 res3=0。
    - text_offset是相对DRAM基址的加载偏移；头后不填充额外2MiB，也不由外部脚本拼头。image_size包含BSS占用，等于ALLOC_BEGIN减去.text起点，不包含完整128MiB可分配区。
    - 关闭sstatus.SIE并清sie；先检查FIRST_HART <= a0 < NCPU，无效hart在访问栈或共享数组前进入wfi循环。
    - 有效启动hart在使用CPU_stack前逐8字节清空[BSS_BEGIN, BSS_END)，保持a0/a1；随后写boot_hartid=a0。
    - 进入共用栈路径，将sp设为CPU_stack + (hartid+1)*4096，保持a0作为start的hartid参数。
    post:
    - BSS仅由首次入口清空一次；当前hart使用独立早期栈调用start(hartid)，若start意外返回则停在wfi循环。
  _entry_secondary:
    pre:
    - boot_hartid通过SBI HSM以本入口地址启动目标hart，a0为目标物理hart ID。
    effects:
    - 关闭sstatus.SIE并清sie；按相同有效范围检查a0，无效hart在访问栈或共享数组前进入wfi循环。
    - 直接进入与_entry共用的栈设置及start调用路径，绝不清空BSS或改写boot_hartid。
    post:
    - 次级hart使用自己的4096字节栈槽，保留启动hart已经发布的共享状态；start意外返回时停在wfi循环。
  void start(uint64 hartid):
    pre:
    - 由_entry或_entry_secondary在S-mode调用，hartid满足FIRST_HART <= hartid < NCPU。
    effects:
    - 将satp清零并执行sfence.vma，把hartid写入tp，然后调用main。
    post:
    - main开始时仍在S-mode和bare地址转换状态，tp稳定保存当前hart ID；start不执行mret且不返回。
  void main(void):
    effects:
    - boot_hartid初始化打印、物理内存、内核页表、全局trap和进程状态，发布initialized，并遍历FIRST_HART至NCPU-1，跳过自身，通过sbi_hart_start以_entry_secondary启动其余有效hart。
    - 每个hart安装内核页表、本地PLIC与stvec环境；本核trap_kernel_inithart完成后，仅boot_hartid调用一次uart_enable_rx_interrupt，再执行原有timer_init，通过SBI TIME设置本核首次定时事件。
    post:
    - boot_hartid在共享初始化完成前不启动次级hart；每次HSM调用均检查sbi_ret_t.error。
    - boot_hartid完成本地执行环境后负责proc_make_first及直接进入唯一首用户进程；其他hart等待initialized后完成本地初始化，并停在可处理中断的wfi循环。
    - UART RX开放前，本核PLIC、stvec和SEIE已准备完成；不在RX路径准备前开放串口接收中断。
    - 每个有效hart恰好输出一次带OpenSBI的启动提示；共享初始化和首进程创建仅由boot_hartid执行。
    - 主流程不返回。
