module: kernel/sleeplock
owns:
  - src/kernel/lock/sleeplock.c
state:
  sleeplock_t: 含保护锁lock、locked、持有者pid及名称；类型及声明由kernel/lock的头文件提供。
rules:
  - 获取睡眠锁只能发生于可睡眠进程上下文；竞争者在同一锁对象通道上循环检查条件，不在硬中断中获取。
  - 修改持有状态与sleep/wakeup均在内部自旋锁保护下协调，唤醒不等于已取得睡眠锁。
functions:
  "void sleeplock_init(sleeplock_t *lk, const char *name);":
    effects:
      - 初始化内部自旋锁，清除持有状态及 PID。
    post:
      - 锁可供进程获取。
  "bool sleeplock_holding(sleeplock_t *lk);":
    pre:
      - 锁已初始化。
    effects:
      - 用内部锁保护持有状态检查。
    post:
      - 仅当前进程 PID 等于持有者时返回 true，无当前进程时返回 false。
  "void sleeplock_acquire(sleeplock_t *lk);":
    pre:
      - 可睡眠的进程上下文，当前进程未持有该锁。
    effects:
      - 持内部锁循环检查，已被占用时通过 proc_sleep 在锁对象通道等待。
    post:
      - 返回时当前进程独占持有睡眠锁，内部自旋锁已释放。
  "void sleeplock_release(sleeplock_t *lk);":
    pre:
      - 当前进程持有睡眠锁。
    effects:
      - 在内部锁下清除状态与 PID，并唤醒锁对象通道上的等待者。
    post:
      - 等待者可以重新竞争，非所有者释放属于内核错误。
