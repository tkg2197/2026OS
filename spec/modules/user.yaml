module: user/initcode
owns:
- src/user/initcode.c
- src/user/sys.h
- src/user/syscall_arch.h
- src/user/syscall_num.h
rules:
- a7 为调用号，a0..a5 为参数，a0 为结果；内联 ecall 声明 memory clobber。
- main 明确放在 USER_BASE=0x1000；保留 Lab5 的 mmap 和 munmap 封装。
functions:
  int main(void):
    effects:
    - 经 SYS_getpid 验证首进程 PID 为1，经 SYS_print_str 输出问候。
    post:
    - 用户程序保持可抢占的循环。验收脚本另行替换入口运行完整测试用例。
