module: kernel/memory
owns:
- src/kernel/mem/pmem.c
- src/kernel/mem/heap.c
- src/kernel/mem/kvm.c
- src/kernel/mem/type.h
- src/kernel/mem/method.h
state:
  physical_layout: QEMU RAM [0x80000000,0x88200000)，OpenSBI前2MiB；ALLOC_BEGIN后前1024页是内核池，其余是用户池。
  allocator: 继承Lab2已完成的buddy分阶链表、状态数组与区域锁；分配成功清零，释放验证阶数和所有权。
  page_tables: Sv39三级树，支持Lab2已有4KiB/2MiB/1GiB混合映射；新进程只使用4KiB页。
rules:
- 继承接口pmem_alloc及vm_mappages在必要内核分配失败时panic；Lab4可恢复进程构造必须使用pmem_try_alloc与vm_try_mappage。
- 页表访问由构造者独占串行化，运行前发布；不实现多hart运行时TLB shootdown。
- TRAMPOLINE=VA_MAX-PGSIZE，TRAPFRAME=TRAMPOLINE-PGSIZE，USTACK=TRAPFRAME-PGSIZE，KSTACK(i)=TRAMPOLINE-(i+1)*2*PGSIZE。
- 用户代码RXU、用户栈RWU；TRAMPOLINE RX与TRAPFRAME RW均无PTE_U；内核页表不映射TRAPFRAME别名，该位置作为KSTACK(0)上方保护页。
- 内核通过proc.tf的物理恒等映射访问trapframe；trampoline在内核与用户页表同一高VA映射同一物理页。
functions:
  void *pmem_try_alloc(bool in_kernel):
    pre:
    - 分配器已初始化。
    effects:
    - 从指定buddy区域申请order=0的一页，成功清零整页；锁在所有返回路径释放。
    post:
    - 成功返回独占页对齐指针；容量不足返回NULL，不panic且区域容量不变。
  bool vm_try_mappage(pgtbl_t pgtbl, uint64 va, uint64 pa, int perm):
    pre:
    - 页表为未发布且由调用者独占的Sv39根；中间节点已存在时由该树独占。
    effects:
    - 校验根、VA/PA范围、页对齐和R/W/X/U权限；最多申请两级中间表；拒绝上层大页冲突或已有末级映射。
    - 成功建立单页叶项并补V/A及可写页D；失败逆序清除并释放本次新建的中间页。
    post:
    - 成功返回true；失败返回false，不改变调用前已有映射，不留下本次中间页，不释放调用者数据页。
  void kvm_init(void):
    pre:
    - 启动阶段单次调用，物理分配器已初始化，尚无hart使用该根。
    effects:
    - 建立UART/PLIC的RW恒等映射，内核代码RX和数据及可分配内存RW恒等映射，继承混合大页算法。
    - 额外把TRAMPOLINE映射到trampoline物理页RX，申请清零内核页映射KSTACK(0)为RW，不映射TRAPFRAME保护页。
    post:
    - 全部映射无PTE_U；本阶段启动必要资源失败为不可继续的内核启动错误；用户运行时构造失败走独立可恢复接口。
  void vm_unmappages(pgtbl_t pgtbl, uint64 va, uint64 len, bool freeit):
    pre:
    - 范围已映射且调用者独占修改；目标映射已停用。
    effects:
    - 必要时拆分大页，清除对应叶项并刷新本地TLB；freeit=true仅对L0页归还用户池。
    post:
    - freeit=false不释放数据页，用于解除借用的trampoline/tf映射；中间表留待freewalk。
  void vm_freewalk(pgtbl_t pgtbl):
    pre:
    - 根非NULL、已停用，所有叶项已先解除，每级页表由调用者独占。
    effects:
    - 后序递归释放子页表再释放根，全部归还内核池。
    post:
    - 原页表不再可用，不负责释放叶映射数据页；发现残留叶项panic以暴露所有权错误。
